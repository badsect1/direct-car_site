name: Daily Auto SEO & GEO Post to Direct-car.co.kr

on:
  schedule:
    # 매일 한국 시간 오전 8시 30분 (UTC 23:30) 무인 자동 실행
    - cron: '30 23 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동 'Run workflow' 즉시 실행 가능

jobs:
  post-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ⚙️ Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🤖 AI SEO & GEO 자동차보험 전문 칼럼 자동 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate_post.mjs

      - name: 💾 생성된 글 Git 저장소에 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ data/posts.json sitemap.xml
          git commit -m "Auto: daily direct-car SEO/GEO post $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin main

      - name: 🐍 Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Hostinger SFTP 서버로 자동 배포
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: '65002'
          FTP_REMOTE_DIR: 'domains/direct-car.co.kr/public_html'
        run: |
          pip install paramiko
          python scripts/upload_to_hostinger.py
